<h1>Marcos Oliveira</h1>
<form method="post" class="card form">
  <label>Nome*<input name="nome" required value="Marcos Oliveira"></label>
  <label>Telefone<input name="telefone" value="(43) 99811-2233"></label>
  <label>E-mail<input name="email" type="email" value="marcos@email.com"></label>
  <label>Assunto<select name="area"><option selected>Trabalhista</option><option >Cível</option><option >Família</option><option >Outra</option></select></label>
  <label>Origem<select name="origem"><option selected>Site</option><option >WhatsApp</option><option >Instagram</option><option >Indicação</option><option >Telefone</option><option >Outro</option></select></label>
  <label>Status<select name="status"><option selected>Novo</option><option >Em contato</option><option >Consulta agendada</option><option >Virou cliente</option><option >Perdido</option></select></label>
  <label class="full">Mensagem<textarea name="mensagem" rows="4">Fui demitido sem receber as verbas rescisórias e as horas extras.</textarea></label>
  <label class="full">Observações internas<textarea name="observacoes" rows="3"></textarea></label>
  <div class="full acoes"><button class="btn">Salvar</button><a href="../admin/leads.html">Cancelar</a></div>
</form>

<div class="acoes">
  <form method="post" action="#"><button class="btn">Converter em cliente</button></form>
  <form method="post" action="#" onsubmit="return confirm('Excluir este lead?')"><button class="btn perigo">Excluir</button></form>
</div>
