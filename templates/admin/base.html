<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}CRM{% endblock %} | Perussi Advogados</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>
{% if session.admin %}
<header class="bar">
  <a href="{{ url_for('dashboard') }}" class="marca"><img src="{{ url_for('static', filename='img/logo-branco.png') }}" alt=""> CRM</a>
  <nav>
    {% set ep = request.endpoint or '' %}
    <a href="{{ url_for('dashboard') }}" class="{{ 'on' if ep=='dashboard' }}">Início</a>
    <a href="{{ url_for('leads') }}" class="{{ 'on' if ep.startswith('lead') }}">Leads</a>
    <a href="{{ url_for('clientes') }}" class="{{ 'on' if ep.startswith('cliente') }}">Clientes</a>
    <a href="{{ url_for('processos') }}" class="{{ 'on' if ep.startswith('processo') }}">Processos</a>
    <a href="{{ url_for('agenda') }}" class="{{ 'on' if ep in ('agenda','compromisso_form') }}">Agenda</a>
  </nav>
  <div class="dir">
    <a href="{{ url_for('home') }}" target="_blank">Ver site</a>
    <form method="post" action="{{ url_for('logout') }}"><button class="link">Sair</button></form>
  </div>
</header>
{% endif %}
<main class="wrap">
  {% for cat, msg in get_flashed_messages(with_categories=true) %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
